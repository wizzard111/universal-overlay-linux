[package]
name = "universal-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "uo_overlay"
path = "src/lib.rs"

[[bin]]
name = "universal-overlay"
path = "src/main.rs"

[[bin]]
name = "uo-probe"
path = "src/bin/probe.rs"

[dependencies]
ab_glyph = "0.2.32"
uo-common = { path = "../common" }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.9.1"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
x11-dl = "2.21.0"
