# Push a tag like v0.2.0: test, build and publish a GitHub release with the
# archive and SHA256SUMS.txt — exactly what the updater downloads.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UO_GITHUB_REPO: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04   # older glibc: the binaries run on more distributions
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: sh build/build.sh
      - run: cp target/dist/SHA256SUMS-linux.txt target/dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/dist/*.tar.gz target/dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: universal-overlay-linux
          path: source/target/dist/*
